version: "3.9"

services:
  api:
    build: .
    container_name: api
    environment:
      - PORT=3000
      # add more env here (DB_URL, JWT_SECRET, etc.)
    ports:
      - "3000:3000"     # host → container
    restart: unless-stopped

    # Simple healthcheck using Node's fetch inside the container
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:'+(process.env.PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 5